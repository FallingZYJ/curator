name: Link check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          # lychee v0.23.0 removed --exclude-mail; mail links are excluded unless --include-mail is provided.
          args: >-
            "./docs/**/*.md"
            --scheme http
            --scheme https
            --cache
            --max-cache-age 7d
            --verbose
            --accept 200,403,429
          output: ./lychee-out.md
          format: markdown
          failIfEmpty: true
          jobSummary: true
          checkbox: true
